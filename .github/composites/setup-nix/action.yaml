name: setup-nix
description: Install Nix and load the flake.nix devShell into the job environment

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@v23

    # devShell の PATH と env を GITHUB_PATH / GITHUB_ENV に書くので、以後の step は素で動く
    - uses: nicknovitski/nix-develop@v1.2.1
