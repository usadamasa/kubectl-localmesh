---
name: CI

"on":
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go と開発ツールは flake.nix の devShell から取る。版の正本は flake.lock。
# nix-develop が devShell の PATH と env を GITHUB_PATH / GITHUB_ENV に書くので、以後の step は素で動く
jobs:
  ci-status-check:
    runs-on: ubuntu-slim
    needs:
      - build
      - yamllint
      - snapshot
      - e2e
    if: always()
    timeout-minutes: 10
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: golangci-lint
        run: golangci-lint run

      - name: test
        run: task test

      - name: Build
        run: task build

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: "actions/checkout@v6"

      - name: "review yaml format"
        uses: reviewdog/action-yamllint@v1
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          reporter: "github-pr-review"
          level: "warning"
          yamllint_flags: "-c .yamllint.yaml ."
          fail_level: "error"

  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Build
        run: task build

      - name: Run snapshot tests
        run: task snapshot:run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Load devShell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Run E2E tests (docker-compose)
        run: task e2e:run

      - name: Cleanup
        if: always()
        run: task e2e:down
