---
name: CI

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go と開発ツールは flake.nix の devShell から取る (usadamasa/gh-manage の setup-nix)。版の正本は flake.lock
jobs:
  ci-status-check:
    runs-on: ubuntu-slim
    needs:
      - build
      - yamllint
      - snapshot
      - e2e
      - actions-lock
    if: always()
    timeout-minutes: 10
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: setup-nix
        uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: golangci-lint
        run: golangci-lint run

      - name: test
        run: task test

      - name: Build
        run: task build

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: "actions/checkout@v7.0.1"

      - name: setup-nix
        uses: usadamasa/gh-manage/actions/setup-nix@main

      # -f github で指摘を workflow の annotation に出す。warning では落とさず、error だけで落ちる
      - name: "review yaml format"
        run: yamllint -f github -c .yamllint.yaml .

  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: setup-nix
        uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Build
        run: task build

      - name: Run snapshot tests
        run: task snapshot:run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: setup-nix
        uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Run E2E tests (docker-compose)
        run: task e2e:run

      - name: Cleanup
        if: always()
        run: task e2e:down

  actions-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
