---
name: CI

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go と開発ツールは flake.nix の devShell から取る (.github/composites/setup-nix)。版の正本は flake.lock
jobs:
  ci-status-check:
    runs-on: ubuntu-slim
    needs:
      - build
      - yamllint
      - snapshot
      - e2e
      - actions-lock
    if: always()
    timeout-minutes: 10
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: setup-nix
        uses: $/.github/composites/setup-nix

      - name: golangci-lint
        run: golangci-lint run

      - name: test
        run: task test

      - name: Build
        run: task build

  yamllint:
    runs-on: ubuntu-latest
    # reviewdog が PR の差分を読むため、既定 (read) と同じく pull-requests の読み取りを残す
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "checkout"
        uses: "actions/checkout@v6.1.0"

      - name: "review yaml format"
        uses: reviewdog/action-yamllint@v1.25.2
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          reporter: "github-pr-review"
          level: "warning"
          yamllint_flags: "-c .yamllint.yaml ."
          fail_level: "error"

  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: setup-nix
        uses: $/.github/composites/setup-nix

      - name: Build
        run: task build

      - name: Run snapshot tests
        run: task snapshot:run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: setup-nix
        uses: $/.github/composites/setup-nix

      - name: Run E2E tests (docker-compose)
        run: task e2e:run

      - name: Cleanup
        if: always()
        run: task e2e:down

  actions-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
