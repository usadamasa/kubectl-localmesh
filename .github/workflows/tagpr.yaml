# https://github.com/Songmu/tagpr
name: tagpr

"on":
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      packages: write

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v2.2.2
        id: app-token
        with:
          # usadamasa-tagpr. An App ID is public information, so it is inlined
          # here instead of requiring a per-repository variable.
          app-id: 2551969
          private-key: ${{ secrets.TAGPR_PRIVATE_KEY }}

      - uses: Songmu/tagpr@v1.21.3
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Go と goreleaser は flake.nix の devShell から取る。版の正本は flake.lock
      - name: setup-nix
        uses: $/.github/composites/setup-nix

      - name: "Release"
        if: "steps.tagpr.outputs.tag != ''"
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
