# https://github.com/Songmu/tagpr
name: tagpr

"on":
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # GitHub App usadamasa-tagpr のトークンで動かす
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.TAGPR_CLIENT_ID }}
          private-key: ${{ secrets.TAGPR_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: Songmu/tagpr@v1.21.3
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Go と goreleaser は flake.nix の devShell から取る。版の正本は flake.lock
      - name: setup-nix
        uses: $/.github/composites/setup-nix

      - name: "Release"
        if: "steps.tagpr.outputs.tag != ''"
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
